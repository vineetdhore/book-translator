[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-translator"
version = "0.1.0"
description = "A local, page-by-page PDF book translation workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "opencv-python>=4.10.0",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.24.0",
    "pypdf>=5.0.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.0.1",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[project.scripts]
book-translator = "book_translator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
